############################################################################
# Otter USV 01 configuration file.                                         #
############################################################################

[Require basic.ini]

############################################################################
# General Parameters.                                                      #
############################################################################

[General]
Vehicle                                 = caravela

[Simulators.RemoteSensorSender]
Entity Label                            = FishTag
Enabled                                 = Never #Always
Debug Level 							              = Debug
Sync Period                             = 5
ID                                      = Fish_position_est_1

[Transports.UDP]
Local Port                              = 6007

[Transports.HTTP]
Port                                    = 8083

[Transports.TCP.Client]
Enabled                                 = Simulation
Entity Label                            = TCP with FishData
Server - Address                        = 127.0.0.1
Server - Port                           = 9803
Transports                              = RemoteSensorInfo,
                                          GpsFix


# GPS simulator.
[Simulators.GPS]
#Initial Position                        = 63.32810001,10.09641960
#Initial Position                        = 63.328711,10.104047
Initial Position                        = 63.3436442,10.2003421 # Gaulosen
